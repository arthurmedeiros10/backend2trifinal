<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Carrinho</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#"><img src="logo.png" height="120" alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item active"><a class="nav-link" href="carrinho.html">CARRINHO</a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" style="display:none">Opções</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="d-flex justify-content-center align-items-center">
        <div class="container-fluid" style="max-width:900px; margin:0 auto;">
            <h1 style="color: var(--primary-dark); font-weight:700; text-align:center; margin-bottom:24px;">Meu Carrinho</h1>
            <div id="lista-carrinho"></div>
            <div id="total-carrinho" style="text-align:right; font-size:1.2rem; font-weight:700; margin-top:20px;"></div>
            <button class="btn_enviar" style="margin-top:20px;" onclick="finalizarCompra()">Finalizar Compra</button>
            <button class="btn_enviar" style="margin-top:10px; background:linear-gradient(135deg,#6b7280,#4b5563);" onclick="limparCarrinho()">Limpar Carrinho</button>
        </div>
    </main>

    <div class="position-fixed" style="top:50%; left:50%; transform:translate(-50%,-50%); z-index:1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script>
        function carregarCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            const lista = document.getElementById("lista-carrinho");
            const totalDiv = document.getElementById("total-carrinho");

            if (carrinho.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Carrinho vazio.</p>';
                totalDiv.textContent = "";
                return;
            }

            lista.innerHTML = carrinho.map(item => `
                <div class="card" style="flex-direction:row; align-items:center; justify-content:space-between; margin-bottom:12px;">
                    <span style="font-weight:600;">${item.nome}</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="btn_enviar" style="width:36px; padding:6px; margin:0;" onclick="alterarQtd(${item.id}, -1)">−</button>
                        <span>${item.quantidade}</span>
                        <button class="btn_enviar" style="width:36px; padding:6px; margin:0;" onclick="alterarQtd(${item.id}, 1)">+</button>
                        <button class="btn_enviar" style="width:auto; padding:6px 14px; margin:0; background:linear-gradient(135deg,#ef4444,#dc2626);" onclick="removerItem(${item.id})">Remover</button>
                    </div>
                </div>
            `).join("");

            const totalQtd = carrinho.reduce((s, i) => s + i.quantidade, 0);
            totalDiv.textContent = `Total de itens: ${totalQtd}`;
        }

        function alterarQtd(id, delta) {
            let carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            const item = carrinho.find(i => i.id === id);
            if (!item) return;
            item.quantidade += delta;
            if (item.quantidade <= 0) carrinho = carrinho.filter(i => i.id !== id);
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            carregarCarrinho();
        }

        function removerItem(id) {
            let carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            carrinho = carrinho.filter(i => i.id !== id);
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            carregarCarrinho();
        }

        function limparCarrinho() {
            localStorage.removeItem("carrinho");
            carregarCarrinho();
            mostrarToast("🗑️ Carrinho esvaziado!", "bg-success");
        }

        function finalizarCompra() {
            const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            if (carrinho.length === 0) {
                mostrarToast("❌ Carrinho vazio!", "bg-danger");
                return;
            }
            const token = localStorage.getItem("token");
            if (!token) {
                mostrarToast("❌ Faça login para finalizar a compra!", "bg-danger");
                setTimeout(() => window.location.href = "login.html", 1500);
                return;
            }
            mostrarToast("✅ Compra finalizada com sucesso!", "bg-success");
            localStorage.removeItem("carrinho");
            carregarCarrinho();
        }

        document.addEventListener("DOMContentLoaded", carregarCarrinho);
    </script>

    <script src="./pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
